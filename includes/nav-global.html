<!-- MILO Franchise — Global Nav (paste into each page's Header Tracking Code) -->
<style>
/* ═══ MILO FRANCHISE NAV ═══ */
.milo-nav {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  z-index: 2147483647 !important;
  padding: 1rem 2rem;
  background: transparent;
  transition: all 0.3s ease;
  font-family: 'League Spartan', 'Nunito Sans', sans-serif;
}
.milo-nav.scrolled {
  background: rgba(255,255,255,0.98);
  box-shadow: 0 2px 20px rgba(0,0,0,0.1);
  padding: 0.5rem 2rem;
}
.milo-nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}
.milo-nav-logo img {
  height: 50px;
  transition: all 0.3s;
  filter: brightness(0) invert(1);
}
.milo-nav.scrolled .milo-nav-logo img {
  height: 40px;
  filter: none;
}
.milo-nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
  align-items: center;
  margin: 0;
  padding: 0;
}
.milo-nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95rem;
  transition: color 0.3s;
}
.milo-nav.scrolled .milo-nav-links a {
  color: #1a1a2e;
}
.milo-nav-links a:hover {
  color: #288D11;
}
.milo-nav-links a.active {
  color: #FF8200;
}
.milo-nav-links a.milo-nav-cta {
  background: #FF8200;
  color: white !important;
  padding: 0.6rem 1.5rem;
  border-radius: 50px;
  font-weight: 700;
  transition: all 0.3s;
}
.milo-nav-links a.milo-nav-cta:hover {
  background: #e67300;
  transform: translateY(-2px);
}

/* ═══ HAMBURGER ═══ */
.milo-hamburger {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  flex-direction: column;
  gap: 5px;
  z-index: 2147483647;
}
.milo-hamburger span {
  display: block;
  width: 26px;
  height: 3px;
  background: white;
  border-radius: 3px;
  transition: all 0.3s ease;
}
.milo-nav.scrolled .milo-hamburger span {
  background: #1a1a2e;
}
.milo-hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
.milo-hamburger.open span:nth-child(2) { opacity: 0; }
.milo-hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

/* ═══ MOBILE OVERLAY ═══ */
.milo-nav-links.mobile-open {
  display: flex !important;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10,10,26,0.97);
  justify-content: center;
  align-items: center;
  gap: 2rem;
  z-index: 2147483646;
  padding: 2rem;
  animation: miloFadeIn 0.3s ease;
}
.milo-nav-links.mobile-open a { color: white !important; font-size: 1.3rem; }
.milo-nav-links.mobile-open a.active { color: #FF8200 !important; }
.milo-nav-links.mobile-open a.milo-nav-cta { font-size: 1.1rem; padding: 0.8rem 2rem; }
@keyframes miloFadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 768px) {
  .milo-nav-links { display: none; }
  .milo-hamburger { display: flex; }
}

/* ═══ HIDE GHL DEFAULT NAV ═══ */
#navbar, nav.navbar, #nav-menu-popup,
#__nuxt, .hl_header--sticky {
  display: none !important;
  height: 0 !important;
  overflow: hidden !important;
  visibility: hidden !important;
}
</style>

<script>
(function() {
  'use strict';

  /* ── Load Google Fonts ── */
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@300;400;600;700&display=swap';
  document.head.appendChild(link);

  /* ── Detect current page ── */
  function getCurrentPage() {
    var path = window.location.pathname.replace(/^\//, '').replace(/\/$/, '').toLowerCase();
    if (path === '' || path === 'home') return 'home';
    return path;
  }

  /* ── Build Nav ── */
  function buildNav() {
    if (document.getElementById('milo-nav')) return;

    /* Hide any GHL native nav */
    document.querySelectorAll('nav.navbar, nav#navbar, #nav-menu-popup').forEach(function(el) {
      el.style.display = 'none';
      el.style.height = '0';
    });
    /* Collapse __nuxt if it only holds nav */
    var nuxt = document.getElementById('__nuxt');
    if (nuxt) { nuxt.style.display = 'none'; nuxt.style.height = '0'; }

    var currentPage = getCurrentPage();
    var pages = [
      { label: 'Home', page: 'home', href: '/' },
      { label: 'About', page: 'about', href: '/about' },
      { label: 'Opportunity', page: 'opportunity', href: '/opportunity' },
      { label: 'Support', page: 'support', href: '/support' },
      { label: 'FAQ', page: 'faq', href: '/faq' },
      { label: 'Get Started', page: 'contact', href: '/contact', cta: true }
    ];

    var nav = document.createElement('nav');
    nav.className = 'milo-nav';
    nav.id = 'milo-nav';

    var inner = document.createElement('div');
    inner.className = 'milo-nav-inner';

    /* Logo */
    var logoLink = document.createElement('a');
    logoLink.className = 'milo-nav-logo';
    logoLink.href = '/';
    var logoImg = document.createElement('img');
    logoImg.src = 'https://assets.cdn.filesafe.space/862EsIISRtzQUOq3B1vZ/media/69b9e24908e9f26f3136fb70.svg';
    logoImg.alt = 'MILO Insulation';
    logoLink.appendChild(logoImg);
    inner.appendChild(logoLink);

    /* Nav links */
    var ul = document.createElement('ul');
    ul.className = 'milo-nav-links';
    pages.forEach(function(p) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = p.href;
      a.textContent = p.label;
      a.dataset.page = p.page;
      if (p.cta) a.className = 'milo-nav-cta';
      if (p.page === currentPage) a.classList.add('active');
      li.appendChild(a);
      ul.appendChild(li);
    });
    inner.appendChild(ul);

    /* Hamburger */
    var burger = document.createElement('button');
    burger.className = 'milo-hamburger';
    burger.setAttribute('aria-label', 'Toggle menu');
    burger.innerHTML = '<span></span><span></span><span></span>';
    inner.appendChild(burger);

    nav.appendChild(inner);
    document.body.insertBefore(nav, document.body.firstChild);

    /* Hamburger toggle */
    burger.addEventListener('click', function() {
      burger.classList.toggle('open');
      ul.classList.toggle('mobile-open');
      document.body.style.overflow = ul.classList.contains('mobile-open') ? 'hidden' : '';
    });
    ul.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() {
        burger.classList.remove('open');
        ul.classList.remove('mobile-open');
        document.body.style.overflow = '';
      });
    });

    /* Scroll behavior: transparent → white */
    function onScroll() {
      var n = document.getElementById('milo-nav');
      if (n) n.classList.toggle('scrolled', window.scrollY > 50);
    }
    window.addEventListener('scroll', onScroll);
    onScroll();
  }

  /* ── Run ── */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildNav);
  } else {
    buildNav();
  }
  /* Retry for GHL's slow rendering */
  setTimeout(buildNav, 300);
  setTimeout(buildNav, 800);
  setTimeout(buildNav, 1500);
})();
</script>
