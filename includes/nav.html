<script>
(function(){
  var ham   = document.getElementById('milo-hamburger');
  var links = document.getElementById('milo-nav-links');
  if (ham && links) {
    ham.addEventListener('click', function(){ links.classList.toggle('open'); });
    ham.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') links.classList.toggle('open'); });
  }
  // Active link highlighting
  var path = window.location.pathname.toLowerCase();
  document.querySelectorAll('#milo-nav-links a').forEach(function(a){
    var href = (a.getAttribute('href') || '').split('/').pop().toLowerCase();
    if (href && path.indexOf(href) > -1) a.classList.add('active');
  });
})();
</script>
