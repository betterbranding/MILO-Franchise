<nav id="milo-nav">
  <div class="nav-inner">
    <a class="nav-logo" href="https://franchise.miloinsulation.com/home">
      <img src="https://assets.cdn.filesafe.space/862EsIISRtzQUOq3B1vZ/media/69b9e24908e9f26f3136fb70.svg" alt="MILO Insulation Franchise" />
    </a>
    <div class="nav-hamburger" id="milo-hamburger" aria-label="Toggle menu" role="button" tabindex="0">
      <span></span><span></span><span></span>
    </div>
    <div class="nav-links" id="milo-nav-links">
      <a href="https://franchise.miloinsulation.com/home">Home</a>
      <a href="https://franchise.miloinsulation.com/about">About</a>
      <a href="https://franchise.miloinsulation.com/opportunity">Opportunity</a>
      <a href="https://franchise.miloinsulation.com/support">Support</a>
      <a href="https://franchise.miloinsulation.com/faq">FAQ</a>
      <span class="nav-cta"><a href="https://franchise.miloinsulation.com/contact">Get Started →</a></span>
    </div>
  </div>
</nav>
<script>
(function(){
  var ham   = document.getElementById('milo-hamburger');
  var links = document.getElementById('milo-nav-links');
  if (ham && links) {
    ham.addEventListener('click', function(){
      links.classList.toggle('open');
      ham.classList.toggle('open');
      document.body.style.overflow = links.classList.contains('open') ? 'hidden' : '';
    });
    ham.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') ham.click();
    });
    // Close mobile menu when a link is clicked
    links.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        links.classList.remove('open');
        ham.classList.remove('open');
        document.body.style.overflow = '';
      });
    });
  }
  // Active link highlighting
  var path = window.location.pathname.toLowerCase().replace(/\/$/, '');
  document.querySelectorAll('#milo-nav-links a').forEach(function(a){
    var href = (a.getAttribute('href') || '').split('/').pop().toLowerCase();
    var current = path.split('/').pop();
    if (href && href === current) a.classList.add('active');
    if (!current && href === 'home') a.classList.add('active');
  });
})();
</script>
