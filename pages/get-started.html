<script>
const { useState, useEffect, useRef, useCallback } = React;
const CONFIG = {
  API_KEY: "pit-d160d69a-99b5-4521-aa51-fdd0c8700b20",
  LOCATION_ID: "862EsIISRtzQUOq3B1vZ",
  CALENDAR_ID: "uBAzux7l6Ywgb86Qumne",
  CALENDAR_USER_ID: "1R6t2NdraXiJhhOGgcqj",
  CALENDAR_SLUG: "milo-franchise-interview",
  API_BASE: "https://services.leadconnectorhq.com",
  API_VERSION: "2021-07-28",
  LOGO_URL: "https://assets.cdn.filesafe.space/862EsIISRtzQUOq3B1vZ/media/69b9e24908e9f26f3136fb70.svg",
  TIMEZONE: Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Chicago"
};
const apiHeaders = () => ({
  "Authorization": `Bearer ${CONFIG.API_KEY}`,
  "Version": CONFIG.API_VERSION,
  "Content-Type": "application/json"
});
async function createContact(data) {
  const res = await fetch(`${CONFIG.API_BASE}/contacts/`, {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify({
      locationId: CONFIG.LOCATION_ID,
      firstName: data.firstName,
      lastName: data.lastName,
      email: data.email,
      phone: data.phone,
      address1: data.address,
      city: data.city,
      state: data.state,
      postalCode: data.zip,
      source: "Franchise Lead Form",
      tags: ["franchise-lead", "lead-form"],
      customFields: [
        { key: "investment_ready", field_value: data.investmentReady },
        { key: "timeline", field_value: data.timeline }
      ]
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    if (err.meta && err.meta.contactId) {
      await updateContact(err.meta.contactId, data);
      return { id: err.meta.contactId };
    }
    if (err.message && typeof err.message === "string" && (err.message.includes("already exists") || err.message.includes("duplicat") || err.message.includes("does not allow"))) {
      const search = await fetch(
        `${CONFIG.API_BASE}/contacts/?locationId=${CONFIG.LOCATION_ID}&query=${encodeURIComponent(data.email)}&limit=1`,
        { headers: apiHeaders() }
      );
      if (search.ok) {
        const found = await search.json();
        if (found.contacts && found.contacts.length > 0) {
          await updateContact(found.contacts[0].id, data);
          return found.contacts[0];
        }
      }
      const search2 = await fetch(
        `${CONFIG.API_BASE}/contacts/?locationId=${CONFIG.LOCATION_ID}&query=${encodeURIComponent(data.phone)}&limit=1`,
        { headers: apiHeaders() }
      );
      if (search2.ok) {
        const found2 = await search2.json();
        if (found2.contacts && found2.contacts.length > 0) {
          await updateContact(found2.contacts[0].id, data);
          return found2.contacts[0];
        }
