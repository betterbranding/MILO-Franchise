<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Config ──
const CONFIG = {
  API_KEY: 'pit-d160d69a-99b5-4521-aa51-fdd0c8700b20',
  LOCATION_ID: '862EsIISRtzQUOq3B1vZ',
  CALENDAR_ID: 'uBAzux7l6Ywgb86Qumne',
  CALENDAR_USER_ID: '1R6t2NdraXiJhhOGgcqj',
  CALENDAR_SLUG: 'milo-franchise-interview',
  API_BASE: 'https://services.leadconnectorhq.com',
  API_VERSION: '2021-07-28',
  LOGO_URL: 'https://assets.cdn.filesafe.space/862EsIISRtzQUOq3B1vZ/media/69b9e24908e9f26f3136fb70.svg',
  TIMEZONE: Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Chicago',
};

// ── API Helpers ──
const apiHeaders = () => ({
  'Authorization': `Bearer ${CONFIG.API_KEY}`,
  'Version': CONFIG.API_VERSION,
  'Content-Type': 'application/json',
});

async function createContact(data) {
  const res = await fetch(`${CONFIG.API_BASE}/contacts/`, {
    method: 'POST',
    headers: apiHeaders(),
    body: JSON.stringify({
      locationId: CONFIG.LOCATION_ID,
      firstName: data.firstName,
      lastName: data.lastName,
      email: data.email,
      phone: data.phone,
      address1: data.address,
      city: data.city,
      state: data.state,
      postalCode: data.zip,
      source: 'Franchise Lead Form',
      tags: ['franchise-lead', 'lead-form'],
      customFields: [
        { key: 'investment_ready', field_value: data.investmentReady },
        { key: 'timeline', field_value: data.timeline },
      ],
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    // If contact already exists (duplicate), use the existing contact
    if (err.meta && err.meta.contactId) {
      // Update existing contact with latest data
      await updateContact(err.meta.contactId, data);
      return { id: err.meta.contactId };
    }
    if (err.message && (typeof err.message === 'string') && 
        (err.message.includes('already exists') || err.message.includes('duplicat') || err.message.includes('does not allow'))) {
      // Search by email
      const search = await fetch(
        `${CONFIG.API_BASE}/contacts/?locationId=${CONFIG.LOCATION_ID}&query=${encodeURIComponent(data.email)}&limit=1`,
        { headers: apiHeaders() }
      );
      if (search.ok) {
        const found = await search.json();
        if (found.contacts && found.contacts.length > 0) {
          await updateContact(found.contacts[0].id, data);
          return found.contacts[0];
        }
      }
      // Search by phone
      const search2 = await fetch(
        `${CONFIG.API_BASE}/contacts/?locationId=${CONFIG.LOCATION_ID}&query=${encodeURIComponent(data.phone)}&limit=1`,
        { headers: apiHeaders() }
      );
      if (search2.ok) {
        const found2 = await search2.json();
        if (found2.contacts && found2.contacts.length > 0) {
          await updateContact(found2.contacts[0].id, data);
          return found2.contacts[0];
        }
      }
    }
    throw new Error('Failed to create contact');
  }
  const result = await res.json();
  return result.contact;
}

async function updateContact(contactId, data) {
  try {
    await fetch(`${CONFIG.API_BASE}/contacts/${contactId}`, {
      method: 'PUT',
      headers: apiHeaders(),
      body: JSON.stringify({
        firstName: data.firstName,
        lastName: data.lastName,
        address1: data.address,
        city: data.city,
        state: data.state,
        postalCode: data.zip,
        tags: ['franchise-lead', 'lead-form'],
        customFields: [
          { key: 'investment_ready', field_value: data.investmentReady },
          { key: 'timeline', field_value: data.timeline },
        ],
      }),
    });
  } catch (e) {
    console.warn('Failed to update contact:', e);
  }
}

// ── US States ──
const US_STATES = [
  'Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','Florida','Georgia',
  'Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland',
  'Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey',
  'New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina',
  'South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington','West Virginia','Wisconsin','Wyoming'
];

// ── Components ──
function ProgressBar({ step, total }) {
  const pct = Math.round(((step) / total) * 100);
  return (
    <div className="w-full max-w-xl mx-auto mb-8">
      <div className="flex justify-between items-center mb-2">
        <span className="text-xs font-semibold text-white/60 uppercase tracking-wider">Step {step + 1}</span>
        <span className="text-xs font-semibold text-white/60">{pct}%</span>
      </div>
      <div className="h-2 bg-white/10 rounded-full overflow-hidden">
        <div className="progress-fill h-full rounded-full" style={{ width: `${pct}%` }} />
      </div>
    </div>
  );
}

function OptionCard({ emoji, title, subtitle, selected, onClick, disabled }) {
  return (
    <div
      className={`option-card rounded-xl p-5 flex items-start gap-4 ${selected ? 'selected' : ''} ${disabled ? 'opacity-40 cursor-not-allowed' : ''}`}
      onClick={disabled ? undefined : onClick}
    >
      <span className="text-3xl flex-shrink-0 mt-0.5">{emoji}</span>
      <div>
        <h4 className="text-white font-semibold text-base">{title}</h4>
        {subtitle && <p className="text-white/50 text-sm mt-1">{subtitle}</p>}
      </div>
    </div>
  );
}

function BackButton({ onClick }) {
  return (
    <button
      onClick={onClick}
      className="flex items-center gap-2 text-white/50 hover:text-white/80 transition-colors text-sm font-medium mt-6"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back
    </button>
  );
}

function NextButton({ onClick, disabled, text = 'Continue', loading }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled || loading}
      className={`w-full mt-6 py-4 px-8 rounded-xl font-bold text-base text-white transition-all ${
        disabled ? 'bg-white/10 cursor-not-allowed text-white/30' : 'bg-milo-orange hover:bg-orange-500 btn-pulse'
      }`}
    >
      {loading ? (
        <span className="flex items-center justify-center gap-2">
          <svg className="spinner w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <circle cx="12" cy="12" r="10" strokeDasharray="60" strokeDashoffset="20" />
          </svg>
          Processing...
        </span>
      ) : (
        <span className="flex items-center justify-center gap-2">
          {text}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      )}
    </button>
  );
}

// ── Step 1: Quick Qualifier ──
function StepQualifier({ data, setData, onNext }) {
  return (
    <div>
      <p className="text-milo-orange text-xs font-bold uppercase tracking-[0.2em] mb-2">Quick Questions</p>
      <h2 className="text-white text-2xl md:text-3xl font-bold mb-2">Let's see if MILO is right for you</h2>
      <p className="text-white/50 text-sm mb-8">Answer two quick questions to get started</p>

      <div className="mb-8">
        <p className="text-white/70 text-sm font-semibold mb-3">Are you prepared to invest $350,000 – $450,000?</p>
        <div className="space-y-3">
          <OptionCard emoji="✅" title="Yes, I'm Ready" subtitle="I have the capital or financing lined up"
            selected={data.investmentReady === 'yes'} onClick={() => setData({...data, investmentReady: 'yes'})} />
          <OptionCard emoji="🔄" title="I'm Exploring Options" subtitle="Still evaluating my investment capacity"
            selected={data.investmentReady === 'exploring'} onClick={() => setData({...data, investmentReady: 'exploring'})} />
          <OptionCard emoji="📊" title="I Need More Info" subtitle="I'd like to understand the full investment"
            selected={data.investmentReady === 'info'} onClick={() => setData({...data, investmentReady: 'info'})} />
        </div>
      </div>

      {data.investmentReady && (
        <div className="step-enter step-active">
          <p className="text-white/70 text-sm font-semibold mb-3">How soon are you looking to get started?</p>
          <div className="space-y-3">
            <OptionCard emoji="⚡" title="As Soon as Possible" subtitle="Ready to move forward now"
              selected={data.timeline === 'asap'} onClick={() => setData({...data, timeline: 'asap'})} />
            <OptionCard emoji="📅" title="Within 3–6 Months" subtitle="Planning and preparing"
              selected={data.timeline === '3-6months'} onClick={() => setData({...data, timeline: '3-6months'})} />
            <OptionCard emoji="🔍" title="Just Researching" subtitle="Exploring franchise opportunities"
              selected={data.timeline === 'researching'} onClick={() => setData({...data, timeline: 'researching'})} />
          </div>
        </div>
      )}

      <NextButton
        onClick={onNext}
        disabled={!data.investmentReady || !data.timeline}
        text="Continue"
      />
    </div>
  );
}

// ── Step 2: Location ──
function StepLocation({ data, setData, onNext, onBack }) {
  const valid = data.address && data.city && data.state && data.zip;
  return (
    <div>
      <p className="text-milo-orange text-xs font-bold uppercase tracking-[0.2em] mb-2">Your Location</p>
      <h2 className="text-white text-2xl md:text-3xl font-bold mb-2">Where are you looking to open a franchise?</h2>
      <p className="text-white/50 text-sm mb-8">Help us connect you with the right territory information</p>

      <div className="space-y-4">
        <div>
          <label className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-1.5 block">Street Address</label>
          <input className="form-input" placeholder="123 Main St" value={data.address || ''}
            onChange={e => setData({...data, address: e.target.value})} />
        </div>
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-1.5 block">City</label>
            <input className="form-input" placeholder="City" value={data.city || ''}
              onChange={e => setData({...data, city: e.target.value})} />
          </div>
          <div>
            <label className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-1.5 block">State</label>
            <select className="form-input form-select" value={data.state || ''}
              onChange={e => setData({...data, state: e.target.value})}>
              <option value="">Select</option>
              {US_STATES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        </div>
        <div className="w-1/2">
          <label className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-1.5 block">ZIP Code</label>
          <input className="form-input" placeholder="12345" value={data.zip || ''} maxLength={10}
            onChange={e => setData({...data, zip: e.target.value})} />
        </div>
      </div>

      <NextButton onClick={onNext} disabled={!valid} text="Continue" />
      <BackButton onClick={onBack} />
    </div>

}

// ── Step 3: Contact Info ──
function StepContact({ data, setData, onNext, onBack }) {
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email || '');
  const phoneValid = (data.phone || '').replace(/\D/g, '').length >= 10;
  const valid = data.firstName && data.lastName && emailValid && phoneValid;

  const formatPhone = (val) => {
    const digits = val.replace(/\D/g, '').slice(0, 10);
    if (digits.length <= 3) return digits;
    if (digits.length <= 6) return `(${digits.slice(0,3)}) ${digits.slice(3)}`;
    return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
  };

  return (
    <div>
      <p className="text-milo-orange text-xs font-bold uppercase tracking-[0.2em] mb-2">About You</p>
      <h2 className="text-white text-2xl md:text-3xl font-bold mb-2">Tell us a little about yourself</h2>
      <p className="text-white/50 text-sm mb-8">We'll use this to personalize your franchise consultation</p>

      <div className="space-y-4">
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-1.5 block">First Name</label>
            <input className="form-input" placeholder="First name" value={data.firstName || ''}
              onChange={e => setData({...data, firstName: e.target.value})} />
          </div>
          <div>
            <label className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-1.5 block">Last Name</label>
            <input className="form-input" placeholder="Last name" value={data.lastName || ''}
              onChange={e => setData({...data, lastName: e.target.value})} />
          </div>
        </div>
        <div>
          <label className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-1.5 block">Email</label>
          <input className="form-input" type="email" placeholder="you@email.com" value={data.email || ''}
            onChange={e => setData({...data, email: e.target.value})} />
        </div>
        <div>
          <label className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-1.5 block">Phone</label>
          <input className="form-input" type="tel" placeholder="(555) 123-4567" value={data.phone || ''}
            onChange={e => setData({...data, phone: formatPhone(e.target.value)})} />
        </div>
      </div>

      <div className="mt-6 p-4 rounded-xl bg-white/5 border border-white/10">
        <p className="text-white/40 text-xs flex items-start gap-2">
          <svg className="w-4 h-4 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          Your information is secure and never shared. By continuing, you agree to be contacted about MILO franchise opportunities.
        </p>
      </div>

      <NextButton onClick={onNext} disabled={!valid} text="Continue" />
      <BackButton onClick={onBack} />
    </div>
  );
}

// ── Step 4: GHL Booking Widget ──
function StepBookingWidget({ data, onBooked, onBack }) {
  const iframeRef = useRef(null);
  const [widgetLoaded, setWidgetLoaded] = useState(false);

  // Build the GHL widget URL with pre-filled contact + address info
  const widgetUrl = (() => {
    const base = `https://api.leadconnectorhq.com/widget/bookings/${CONFIG.CALENDAR_SLUG}`;
    const params = new URLSearchParams();
    if (data.firstName) params.set('first_name', data.firstName);
    if (data.lastName) params.set('last_name', data.lastName);
    if (data.email) params.set('email', data.email);
    if (data.phone) {
      const digits = data.phone.replace(/\D/g, '');
      params.set('phone', '+1' + digits);
    }
    // Address fields removed from GHL Default form — no longer needed as URL params
    return `${base}?${params.toString()}`;
  })();

  // Listen for postMessage from the GHL widget when booking completes
  useEffect(() => {
    const handleMessage = (event) => {
      // GHL widget sends messages on booking completion
      if (event.data && typeof event.data === 'object') {
        // Check various GHL message types
        if (event.data.type === 'booking-confirmed' || 
            event.data.action === 'booking-confirmed' ||
            event.data.status === 'booked' ||
            (event.data.appointmentData && event.data.appointmentData.id) ||
            (typeof event.data === 'string' && event.data.includes('booked'))) {
          onBooked(event.data);
        }
      }
      if (typeof event.data === 'string') {
        try {
          const parsed = JSON.parse(event.data);
          if (parsed.type === 'booking-confirmed' || parsed.status === 'booked' || parsed.appointmentData) {
            onBooked(parsed);
          }
        } catch(e) {
          // Check for string-based messages
          if (event.data.includes('booked') || event.data.includes('confirmed') || event.data.includes('appointment')) {
            onBooked({});
          }
        }
      }
    };

    window.addEventListener('message', handleMessage);
    return () => window.removeEventListener('message', handleMessage);
  }, [onBooked]);

  return (
    <div>
      <p className="text-milo-orange text-xs font-bold uppercase tracking-[0.2em] mb-2">Schedule a Call</p>
      <h2 className="text-white text-2xl md:text-3xl font-bold mb-2">Pick a time with Tom Martin</h2>
      <p className="text-white/50 text-sm mb-1">Founder of MILO Insulation &bull; 30 minute call</p>
      <p className="text-white/30 text-xs mb-6">Your info has been pre-filled — just select a date & time below</p>

      {/* Loading state */}
      {!widgetLoaded && (
        <div className="flex items-center justify-center py-8">
          <svg className="spinner w-8 h-8 text-milo-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <circle cx="12" cy="12" r="10" strokeDasharray="60" strokeDashoffset="20" />
          </svg>
          <span className="text-white/50 ml-3">Loading calendar...</span>
        </div>
      )}

      {/* GHL Booking Widget */}
      <div className="rounded-xl overflow-hidden" style={{ background: 'white', minHeight: widgetLoaded ? 'auto' : '0px' }}>
        <iframe
          ref={iframeRef}
          src={widgetUrl}
          className="widget-frame"
          style={{ 
            display: widgetLoaded ? 'block' : 'none',
            minHeight: '650px',
          }}
          onLoad={() => setWidgetLoaded(true)}
          allow="payment"
          title="Book a call with Tom Martin"
        />
      </div>

      {/* Fallback: manual confirmation button */}
      {widgetLoaded && (
        <div className="mt-6 text-center">
          <p className="text-white/30 text-xs mb-3">Already booked your call in the calendar above?</p>
          <button
            onClick={() => onBooked({})}
            className="text-milo-orange hover:text-orange-400 text-sm font-semibold underline underline-offset-2 transition-colors"
          >
            I've booked my call — continue →
          </button>
        </div>
      )}

      <BackButton onClick={onBack} />
    </div>
  );
}

// ── Step 5: Confirmation ──
function StepConfirmation({ data }) {
  const [confetti, setConfetti] = useState([]);

  useEffect(() => {
    // Fire Meta Pixel Lead event
    if (typeof fbq === 'function') {
      fbq('track', 'Lead');
    }
    // Confetti
    const colors = ['#FF8200', '#288D11', '#50ACE1', '#FFD700', '#FF4444'];
    const pieces = Array.from({length: 30}).map((_, i) => ({
      id: i,
      left: Math.random() * 100,
      color: colors[Math.floor(Math.random() * colors.length)],
      delay: Math.random() * 2,
      size: 6 + Math.random() * 8,
    }));
    setConfetti(pieces);
  }, []);

  return (
    <div className="text-center">
      {confetti.map(c => (
        <div key={c.id} className="confetti" style={{
          left: `${c.left}%`,
          backgroundColor: c.color,
          width: `${c.size}px`,
          height: `${c.size}px`,
          animationDelay: `${c.delay}s`,
        }} />
      ))}

      <div className="w-20 h-20 mx-auto mb-6 bg-milo-green/20 rounded-full flex items-center justify-center">
        <svg className="w-10 h-10 text-milo-green" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h2 className="text-white text-3xl font-bold mb-3">You're All Set! 🎉</h2>
      <p className="text-white/60 text-base mb-8">Your call with Tom Martin is booked.</p>

      <div className="glass-card p-6 text-left space-y-4 mb-8">
        <div className="flex items-start gap-3">
          <span className="text-xl">👤</span>
          <div>
            <p className="text-white/40 text-xs uppercase font-semibold">With</p>
            <p className="text-white font-medium">Tom Martin, Founder of MILO Insulation</p>
          </div>
        </div>
        <div className="flex items-start gap-3">
          <span className="text-xl">⏱️</span>
          <div>
            <p className="text-white/40 text-xs uppercase font-semibold">Duration</p>
            <p className="text-white font-medium">30 minutes</p>
          </div>
        </div>
        <div className="flex items-start gap-3">
          <span className="text-xl">📧</span>
          <div>
            <p className="text-white/40 text-xs uppercase font-semibold">Confirmation</p>
            <p className="text-white font-medium">Check your email for calendar details</p>
          </div>
        </div>
      </div>

      <div className="glass-card p-5 text-left mb-6">
        <p className="text-white/70 text-sm font-semibold mb-3">What to expect:</p>
        <ul className="space-y-2">
          <li className="flex items-start gap-2 text-white/50 text-sm">
            <span className="text-milo-green mt-0.5">✓</span>
            You'll receive a confirmation email shortly
          </li>
          <li className="flex items-start gap-2 text-white/50 text-sm">
            <span className="text-milo-green mt-0.5">✓</span>
            Tom will call you at the scheduled time
          </li>
          <li className="flex items-start gap-2 text-white/50 text-sm">
            <span className="text-milo-green mt-0.5">✓</span>
            Learn about available territories in your area
          </li>
          <li className="flex items-start gap-2 text-white/50 text-sm">
            <span className="text-milo-green mt-0.5">✓</span>
            No obligation — just an honest conversation
          </li>
        </ul>
      </div>

      <p className="text-white/30 text-xs">
        🔒 Your information is secure and will never be shared.
      </p>
    </div>
  );
}

// ── Main App ──
function App() {
  const [step, setStep] = useState(0);
  const [data, setData] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);
  const containerRef = useRef(null);
  const totalSteps = 4;

  const scrollTop = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (containerRef.current) containerRef.current.scrollTop = 0;
  };

  const goNext = () => { setStep(s => s + 1); scrollTop(); setError(null); };
  const goBack = () => { setStep(s => s - 1); scrollTop(); setError(null); };

  // After contact info, create/find the contact then advance to widget
  const handleContactNext = async () => {
    setSubmitting(true);
    setError(null);
    try {
      const contact = await createContact(data);
      setData(d => ({...d, contactId: contact.id}));
      setStep(3);
      scrollTop();
    } catch (err) {
      console.error('Contact creation error:', err);
      setError('Something went wrong saving your info. Please try again.');
    }
    setSubmitting(false);
  };

  // When GHL widget confirms the booking
  const handleBooked = useCallback((eventData) => {
    setData(d => ({...d, bookingEvent: eventData}));
    setStep(4);
    scrollTop();
  }, []);

  return (
    <div className="min-h-screen flex flex-col">
      {/* Header */}
      <div className="text-center pt-8 pb-4 px-4">
        <img src={CONFIG.LOGO_URL} alt="MILO Insulation" className="h-12 md:h-14 mx-auto mb-4" style={{ filter: 'brightness(0) invert(1)' }} />
        {step < 4 && (
          <h1 className="text-white text-lg md:text-xl font-semibold">
            Start Your <span className="text-milo-orange">Franchise Journey</span>
          </h1>
        )}
      </div>

      {/* Progress */}
      {step < 4 && (
        <div className="px-4">
          <ProgressBar step={step} total={totalSteps} />
        </div>
      )}

      {/* Content */}
      <div className="flex-1 flex items-start justify-center px-4 pb-8" ref={containerRef}>
        <div className={`glass-card w-full ${step === 3 ? 'max-w-2xl' : 'max-w-xl'} p-6 md:p-8`}>
          {error && (
            <div className="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-300 text-sm">
              {error}
            </div>
          )}

          <div className="step-enter step-active" key={step}>
            {step === 0 && <StepQualifier data={data} setData={setData} onNext={goNext} />}
            {step === 1 && <StepLocation data={data} setData={setData} onNext={goNext} onBack={goBack} />}
            {step === 2 && <StepContact data={data} setData={setData} onNext={handleContactNext} onBack={goBack} />}
            {step === 3 && <StepBookingWidget data={data} onBooked={handleBooked} onBack={goBack} />}
            {step === 4 && <StepConfirmation data={data} />}
          </div>

          {submitting && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
              <div className="glass-card p-8 text-center">
                <svg className="spinner w-12 h-12 text-milo-orange mx-auto mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <circle cx="12" cy="12" r="10" strokeDasharray="60" strokeDashoffset="20" />
                </svg>
                <p className="text-white font-semibold">Saving your information...</p>
                <p className="text-white/50 text-sm mt-1">Setting up your profile</p>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Footer */}
      <div className="text-center pb-6 px-4">
        <p className="text-white/20 text-xs">
          MILO Insulation™ — Nature's Very Best. © {new Date().getFullYear()}
        </p>
      </div>
    </div>
  );
}

// ── Render ──
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
